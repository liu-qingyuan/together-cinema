name: Test and container smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
      - run: node --test tests/*.test.cjs
      - run: python scripts/check_release.py
      - run: sh -n install.sh uninstall.sh deploy/caddy-entrypoint.sh
      - run: ./install.sh --port 18080
        env:
          COMPOSE_PROJECT_NAME: together-cinema-ci
      - run: python scripts/smoke.py http://127.0.0.1:18080
      - if: always()
        run: docker compose --profile '*' down --volumes
        env:
          COMPOSE_PROJECT_NAME: together-cinema-ci
